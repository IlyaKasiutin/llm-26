arxiv:
  api_url: "https://export.arxiv.org/api/query"
  pdf_base_url: "https://arxiv.org/pdf"
  papers_dir: "data/papers"
  max_results_limit: 10
  default_max_results: 5
  rate_limit_seconds: 3.0
  timeout_seconds: 120.0
  max_retries: 3
  user_agent: "llm26-research-assistant/0.1"

rag:
  index_dir: "../lab2/artifacts/faiss/dense-frida-cs400-ov50-aed511d7__hnsw-M32-efc200"
  top_n: 5
  ef_search: 64
  notes_path: "data/notes.jsonl"
  embedding:
    model: "ai-forever/FRIDA"
    device: auto
    batch_size: 16
    max_seq_length: 512
    normalize: true
    query_prefix: "search_query: "

agent:
  max_steps: 10
  timeout_seconds: 240.0
  context_strategy: "rolling_summary"
  max_context_tokens: 3000
  reserve_output_tokens: 700

llm:
  base_url: "https://openrouter.ai/api/v1"
  model: "deepseek/deepseek-v4.1-flash-1017"
  api_key_env: "OPENROUTER_API_KEY"
  temperature: 0.1
  max_tokens: 700
  timeout_seconds: 240.0

langfuse:
  enabled: true
  host: "http://127.0.0.1:3000"
  user_id: local

[project]
name = "research-assistant"
version = "0.1.0"
description = "Lab 3: Research Assistant Agent with arXiv MCP, RAG and Langfuse"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.8.0",
    "httpx>=0.27.0",
    "langfuse>=5,<6",
    "langgraph>=0.2.0",
    "mcp>=1.6.0,<2.0.0",
    "numpy>=1.26",
    "openai>=1.40.0",
    "openinference-instrumentation-smolagents>=0.1.50",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.1",
    "sentence-transformers>=3.0",
    "smolagents>=1.26.0",
    "socksio>=1.0.0",
    "tiktoken>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

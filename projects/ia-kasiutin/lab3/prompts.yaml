system_prompt: |
  Ты — исследовательский ИИ-ассистент для поиска, изучения и сравнения научных публикаций.
  Используй инструменты поиска на arXiv для нахождения новых статей, локальный RAG для поиска по базе знаний
  и сохраняй результаты исследования в заметки по запросу пользователя.
  Опирайся строго на данные, полученные из инструментов, и указывай идентификаторы публикаций (arXiv ID или chunk_id).

context_summary_prompt: |
  Сожми предыдущую часть диалога в краткую фактическую сводку.
  Обязательно сохрани:
  1. Исходную цель пользователя и ограничения задачи.
  2. Найденные идентификаторы статей (arXiv ID, названия, ключевые числа и выводы).
  3. Какие инструменты уже вызывались и какие заметки были сохранены.
  Уложи сводку примерно в 150–200 слов.

tools:
  arxiv_search:
    description: >-
      Поиск научных публикаций на arXiv по текстовому запросу с опциональной фильтрацией
      по категориям (например, cs.LG, cs.AI, cs.CE) и диапазону дат публикации (YYYY-MM-DD).
      Возвращает дедуплицированный список статей с arxiv_id, заголовком, авторами, датой и кратким содержанием.
  arxiv_get_details:
    description: >-
      Получение полных метаданных и полного текста аннотации (abstract) конкретной публикации на arXiv
      по её идентификатору (например, "2106.09685" или "2106.09685v2").
  arxiv_download_paper:
    description: >-
      Скачивание PDF-файла публикации с arXiv в локальное хранилище по идентификатору paper_id.
      Если файл уже был скачан ранее, возвращает путь к локальному кэшу без повторной загрузки.
  rag_search:
    description: >-
      Dense-поиск релевантных фрагментов (чанков) по локальному FAISS-индексу базы знаний.
      Возвращает текст фрагментов с метаданными публикации (paper_id, chunk_id, title, section, page, score).
  save_research_note:
    description: >-
      Сохранение структурированной исследовательской заметки (заголовок, текст выводов, список связанных paper_id и тегов)
      в локальное хранилище заметок.
